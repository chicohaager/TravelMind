# Werkzeug-Konfiguration fuer das Backend.
#
# Die Werte stimmen mit .pre-commit-config.yaml ueberein — vorher standen sie
# nur dort, und CI hat sie nie angewandt.

[flake8]
max-line-length = 120
# E203/W503 widersprechen der Formatierung von black.
extend-ignore = E203, W503
exclude =
    .git,
    __pycache__,
    venv,
    node_modules,
    backend/alembic/versions

# Ausnahmen sind ENG: je Datei und je Regel, mit Begruendung.
per-file-ignores =
    # sys.path wird vor den Importen gesetzt, damit die Module ohne Installation
    # gefunden werden. Die Importe koennen deshalb nicht ganz oben stehen.
    backend/tests/conftest.py:E402
    backend/alembic/env.py:E402
    # Lange Zeilen stehen ausschliesslich in mehrzeiligen Zeichenketten: SQL-
    # Ausdruecke und KI-Prompts. Ein Umbruch dort wuerde den Inhalt aendern,
    # und ein inline-noqa ist innerhalb von """...""" nicht moeglich.
    backend/migrate_to_postgres.py:E501
    backend/routes/ai.py:E501
    backend/services/guide_parser.py:E501
