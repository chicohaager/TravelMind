# Pre-commit hooks for TravelMind
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending

  # Python - Black formatter
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        # Kein language_version-Pin: die black-VERSION oben ist gepinnt, das
        # genuegt fuer reproduzierbare Formatierung. Ein Pin auf python3.11
        # liess den Hook auf jeder Maschine ohne genau diese Version scheitern
        # (gemessen 2026-08-25: "failed to find interpreter for python3.11").
        args: [--line-length=120]
        files: ^backend/

  # Python - Flake8 linter
  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        # KEINE args: flake8 liest setup.cfg. Vorher standen die Werte hier
        # doppelt — und abweichend: `--ignore` ERSETZT die Standardliste
        # (dadurch schlug E226 an, das normalerweise darin steht), waehrend
        # setup.cfg `extend-ignore` benutzt. Zwei Konfigurationen, die sich
        # widersprechen, sind schlimmer als eine strenge.
        files: ^backend/
        # Alembic-Migrationen sind erzeugt und enthalten langes SQL. setup.cfg
        # schliesst sie aus; pre-commit uebergibt Dateinamen aber ausdruecklich,
        # und dann greift `exclude` aus der Konfiguration nicht mehr.
        exclude: ^backend/alembic/versions/

  # Python - isort import sorting
  - repo: https://github.com/PyCQA/isort
    rev: 8.0.1
    hooks:
      - id: isort
        args: [--profile=black, --line-length=120]
        files: ^backend/

  # Python - security check
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-c, pyproject.toml, -r, backend/]
        files: ^backend/

  # JavaScript - eslint und prettier des PROJEKTS, nicht eine zweite Fassung.
  #
  # Vorher zogen die Spiegel-Repositories eslint 8 und prettier 4-alpha als
  # eigene Abhaengigkeiten herbei. Das Projekt nutzt aber eslint 9 mit
  # Flat-Config — der Hook haette also etwas anderes geprueft als CI, und genau
  # solche Doppelgaenger sind der Grund, warum ein Gate und die Wirklichkeit
  # auseinanderlaufen. Jetzt laeuft in beiden Faellen dasselbe Werkzeug aus
  # frontend/node_modules, mit frontend/.prettierrc.
  - repo: local
    hooks:
      - id: eslint
        name: eslint (Fassung des Projekts)
        # --config ausdruecklich: der Hook laeuft im Wurzelverzeichnis, dort
        # findet eslint 9 seine Flat-Config nicht von allein.
        entry: npx --prefix frontend eslint --config frontend/eslint.config.js --fix
        language: system
        files: ^frontend/src/.*\.(js|jsx)$
        pass_filenames: true

      - id: prettier
        name: prettier (Fassung des Projekts)
        entry: npx --prefix frontend prettier --write
        language: system
        files: ^frontend/src/.*\.(js|jsx|css)$
        pass_filenames: true

  # Secrets detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package-lock.json

  # Dockerfile linting
  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker
        args: [--ignore, DL3008, --ignore, DL3013]

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        args: [--fix, --config, .markdownlint.json]
