# TravelMind Frontend - Nginx Configuration
# Optimized for single-page application with API proxy
#
# Laeuft als non-root (uid 1001). Deshalb KEINE "user"-Direktive (die setzt einen
# root-Masterprozess voraus) und Port 8080 statt 80 — Ports < 1024 kann ein
# unprivilegierter Prozess nicht binden. Veroeffentlicht wird ueber das
# Port-Mapping der Compose, nicht ueber den Port im Container.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript application/x-javascript
               image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate limiting zone
    # Diese Begrenzung ist die WIRKSAME: sie laeuft in einem Prozess und gilt
    # global. Die Grenzen in der Anwendung (slowapi) zaehlen dagegen je
    # gunicorn-Worker im Arbeitsspeicher — bei vier Workern ist die effektive
    # Grenze dort bis zu viermal so hoch wie konfiguriert. Gemessen 2026-08-25.
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    # Anmeldung und Passwort-Zuruecksetzung eigens, deutlich strenger:
    # Brute-Force-Schutz darf nicht an derselben Grenze haengen wie das
    # normale Blaettern durch Reisen.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=1r/s;

    # 429 statt des nginx-Standards 503. Der Unterschied ist nicht kosmetisch:
    # 503 liest sich als "Dienst ausgefallen" — in der Ueberwachung und fuer
    # jeden Client. 429 sagt, was wirklich passiert ist.
    limit_req_status 429;

    # Uploadgroesse.
    #
    # Ohne diese Zeile gilt nginx' Standard von 1 MB — und das Backend laesst
    # 10 MB zu. Am 2026-08-25 gemessen: 500 KB kommen durch (HTTP 401, also
    # bis zur Anmeldepruefung), 2 MB werden von nginx mit 413 abgewiesen,
    # bevor das Backend sie ueberhaupt sieht. Ein Handyfoto hat 2-5 MB — es
    # war also KEIN Foto vom Telefon hochladbar, und die Fehlermeldung kam
    # von einer Stelle, die keine Uebersetzung kennt.
    #
    # 12m statt 10m: multipart/form-data traegt Rahmen und Kopfzeilen mit,
    # die Grenze soll die des Backends sein, nicht die des Proxys.
    client_max_body_size 12m;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Security: Hide nginx version
        server_tokens off;

        # Static file caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # SPA routing - serve index.html for all routes
        location / {
            try_files $uri $uri/ /index.html;

            # No caching for HTML files
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # API proxy (adjust backend URL as needed)
        # Anmeldung und Passwort-Zuruecksetzung: strengere Zone (1 r/s, burst 5).
        location /api/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://backend:8137;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            # Rate limiting for API
            limit_req zone=api burst=20 nodelay;

            # Proxy to backend
            proxy_pass http://backend:8137;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Uploads proxy
        # ^~ so this prefix wins over the static-asset regex above; otherwise
        # /uploads/*.jpg|png|... is caught by `location ~* \.(...)$` and 404s.
        location ^~ /uploads/ {
            proxy_pass http://backend:8137/uploads/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Cache uploaded files
            expires 7d;
            add_header Cache-Control "public";
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
