# ============================================================================
# TravelMind — Produktions-Compose
# ============================================================================
# Ersetzt die am 2026-08-25 wiederhergestellte Fassung. Zwei Konstruktions-
# fehler der Vorgaengerin sind hier behoben:
#
#   1. KEIN `build:`. Gebaut wird ausserhalb, ausgeliefert werden getaggte
#      Images (Tag = Commit-SHA). Erst dadurch gibt es einen Rueckweg: die
#      Vorversion bleibt unter ihrem Tag liegen und ist ein `up -d` entfernt.
#   2. KEIN `user: "0:0"`. Die Vorgaengerin hat damit das `USER travelmind`
#      aus dem Dockerfile ausgehebelt. Ursache war, dass nginx auf Port 80
#      hoerte — das kann ein unprivilegierter Prozess nicht binden. Behoben
#      an der Ursache: nginx hoert auf 8080, veroeffentlicht wird per
#      Port-Mapping.
#
# Aufruf:
#   TRAVELMIND_TAG=<commit-sha> docker compose -f docker-compose.prod.yml up -d
#
# Erwartet daneben eine .env mit POSTGRES_PASSWORD, JWT_SECRET, SECRET_KEY.
# ============================================================================

name: travelmind

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:

  # ── Datenbank ────────────────────────────────────────────────────────────
  db:
    <<: *hardening
    image: postgres:16-alpine
    container_name: travelmind-db
    environment:
      POSTGRES_USER: travelmind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
      POSTGRES_DB: travelmind
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ${TRAVELMIND_DATA:-.}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelmind -d travelmind"]
      interval: 5s
      timeout: 5s
      retries: 30
    # postgres laeuft ohnehin als uid 70; das Entrypoint braucht zum Wechsel
    # dorthin SETUID/SETGID, alles Uebrige faellt weg.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    networks: [travelmind]

  # ── Migration (laeuft einmal, dann Ende) ─────────────────────────────────
  migrate:
    image: travelmind-backend:${TRAVELMIND_TAG:?TRAVELMIND_TAG fehlt (Commit-SHA)}
    container_name: travelmind-migrate
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://travelmind:${POSTGRES_PASSWORD}@db:5432/travelmind
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET fehlt in .env}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY fehlt in .env}
      TZ: ${TZ:-Europe/Berlin}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [travelmind]

  # ── Backend ──────────────────────────────────────────────────────────────
  backend:
    <<: *hardening
    image: travelmind-backend:${TRAVELMIND_TAG:?TRAVELMIND_TAG fehlt (Commit-SHA)}
    container_name: travelmind-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://travelmind:${POSTGRES_PASSWORD}@db:5432/travelmind
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET fehlt in .env}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY fehlt in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8190}
      ENABLE_DEMO_MODE: "false"
      TZ: ${TZ:-Europe/Berlin}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Schreibgeschuetztes Wurzeldateisystem — belegt am 2026-08-25: der
    # Container startet, /api/health/live antwortet mit 200, die Bind-Mounts
    # bleiben beschreibbar, und `touch /app/probe` scheitert.
    #
    # Drei Verzeichnisse braucht der Prozess trotzdem: /tmp, /app/data (das
    # Lifespan legt es beim Start an, auch mit PostgreSQL) und /app/logs.
    read_only: true
    volumes:
      - ${TRAVELMIND_DATA:-.}/uploads:/app/uploads
      - ${TRAVELMIND_DATA:-.}/backups:/app/backups
      - type: tmpfs
        target: /tmp
        tmpfs: { mode: 01777 }
      - type: tmpfs
        target: /app/data
        tmpfs: { mode: 01777 }
      - type: tmpfs
        target: /app/logs
        tmpfs: { mode: 01777 }
    cap_drop: [ALL]
    networks: [travelmind]

  # ── Frontend (nginx, non-root auf 8080) ──────────────────────────────────
  frontend:
    <<: *hardening
    image: travelmind-frontend:${TRAVELMIND_TAG:?TRAVELMIND_TAG fehlt (Commit-SHA)}
    container_name: travelmind-frontend
    environment:
      TZ: ${TZ:-Europe/Berlin}
    ports:
      - "${TRAVELMIND_PORT:-8190}:8080"
    depends_on:
      backend:
        condition: service_healthy
    # nginx schreibt nur nach /var/cache/nginx und /tmp — beides als tmpfs,
    # der Rest des Dateisystems bleibt schreibgeschuetzt.
    read_only: true
    volumes:
      # tmpfs braucht ausdruecklich mode 1777 — der Docker-Standard gehoert
      # root und ist fuer uid 1001 nicht beschreibbar; nginx scheitert dann an
      # mkdir("/var/cache/nginx/client_temp").
      - type: tmpfs
        target: /tmp
        tmpfs: { mode: 01777 }
      - type: tmpfs
        target: /var/cache/nginx
        tmpfs: { mode: 01777 }
    cap_drop: [ALL]
    networks: [travelmind]

  # ── Sicherung ────────────────────────────────────────────────────────────
  # Laeuft im selben Netz und benutzt den pg_dump DESSELBEN Image-Stands wie
  # der Server — damit koennen die Versionen nicht auseinanderlaufen.
  #
  # Bewusst KEIN Docker-Socket und kein systemd: beides braucht Root auf dem
  # Host. Der Takt-Container ist stattdessen Teil des Verbunds, faehrt mit ihm
  # hoch und runter und ist in `docker ps` sichtbar. Ein ausgefallener
  # Zeitgeber faellt damit auf, statt still zu verschwinden — genau der Fall,
  # der am 2026-08-25 zwei Monate lang niemandem aufgefallen ist.
  backup:
    <<: *hardening
    image: postgres:16-alpine
    container_name: travelmind-backup
    entrypoint: ["/bin/sh", "/skripte/takt.sh"]
    environment:
      PGHOST: db
      PGDATABASE: travelmind
      PGUSER: travelmind
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
      BACKUP_DIR: /backups
      UPLOADS_DIR: /uploads
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_UHRZEIT: ${BACKUP_UHRZEIT:-03:00}
      BACKUP_BEIM_START: ${BACKUP_BEIM_START:-nein}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ${TRAVELMIND_DATA:-.}/deploy/backup:/skripte:ro
      # Die Fotos nur LESEND — eine Sicherung darf nie schreiben koennen,
      # was sie sichert.
      - ${TRAVELMIND_DATA:-.}/uploads:/uploads:ro
      - ${TRAVELMIND_DATA:-.}/backups:/backups
    depends_on:
      db:
        condition: service_healthy
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    networks: [travelmind]

  # ── Waechter ─────────────────────────────────────────────────────────────
  # Der Grund steht im Befund vom 2026-08-25: die Produktion war zwei Monate
  # abgeschaltet, und es ist niemandem aufgefallen — weil nichts hingesehen hat.
  #
  # Prueft Oberflaeche UND API durch dieselbe Kette wie ein Nutzer, und zwar
  # den INHALT, nicht nur den Statuscode: der SPA-Rueckfall beantwortet jeden
  # Pfad mit 200, und die API kann 200 liefern, waehrend die Datenbank weg ist.
  waechter:
    <<: *hardening
    image: curlimages/curl:latest
    container_name: travelmind-waechter
    entrypoint: ["/bin/sh", "/skripte/waechter.sh"]
    environment:
      WATCH_UI: http://frontend:8080/
      WATCH_API: http://backend:8137/api/health
      WATCH_INTERVAL: ${WATCH_INTERVAL:-60}
      WATCH_FAILURES: ${WATCH_FAILURES:-3}
      # Ohne diese beiden meldet der Waechter nur ins Protokoll.
      PUSHOVER_TOKEN: ${PUSHOVER_TOKEN:-}
      PUSHOVER_USER: ${PUSHOVER_USER:-}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ${TRAVELMIND_DATA:-.}/deploy/waechter:/skripte:ro
      # Dem curl-Image fehlt tzdata; ohne die Zonendaten ignoriert es TZ und
      # protokolliert in UTC. Bei einem Alarm ist der Zeitstempel aber genau
      # das, was man spaeter lesen will.
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    networks: [travelmind]

networks:
  travelmind:
    driver: bridge
